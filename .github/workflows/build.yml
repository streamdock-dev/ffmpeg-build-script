name: build test

on:
  push:
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [ master ]

jobs:
  lint:
    name: shell format and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # shfmt reads the indent settings from .editorconfig
      - name: check formatting with shfmt
        run: |
          curl -sSfL -o /tmp/shfmt https://github.com/mvdan/sh/releases/download/v3.12.0/shfmt_v3.12.0_linux_amd64
          chmod +x /tmp/shfmt
          /tmp/shfmt -d build-ffmpeg web-install.sh web-install-gpl-and-non-free.sh src/

      # The runner image ships its own shellcheck, but its version moves without
      # notice - pin one so a new release cannot turn a green branch red.
      # The scripts are clean at --severity=style, the strictest of the four
      # levels, so anything ShellCheck reports here is a regression.
      #
      # The src/ fragments must be named on the command line. -x only makes
      # ShellCheck follow the `source` lines to resolve definitions for the file
      # being checked - it emits no diagnostics for the sourced files, so `-x`
      # on build-ffmpeg alone would lint the loader and nothing else. The glob
      # is deliberate: a fragment added without touching this line still gets
      # linted. Each fragment carries a `# shellcheck shell=bash` directive
      # because fragments have no shebang.
      - name: shellcheck
        run: |
          curl -sSfL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz |
            tar -xJf - -C /tmp --strip-components=1 shellcheck-v0.11.0/shellcheck
          /tmp/shellcheck --version
          /tmp/shellcheck -x --severity=style --color=always build-ffmpeg web-install.sh web-install-gpl-and-non-free.sh src/*.sh src/packages/*.sh

      # Both failures below surface at download time, which is anywhere up to an
      # hour into a build, and neither is loud: a package whose VER_ array name
      # has drifted is fetched unverified rather than failing, and a download URL
      # built from an unassigned variable just requests a nonsense path. Seconds
      # here instead.
      - name: check packages resolve their versions and download variables
        run: |
          status=0

          # download() derives VER_<PACKAGE> from the name passed to build().
          # When the two disagree it finds no checksum and skips verification,
          # so --list-packages resolves them the same way and reports MISSING.
          if ./build-ffmpeg --list-packages | grep -E 'MISSING'; then
            echo "::error::a package above has no VER_ array under the name build() passes to it"
            status=1
          fi

          # X265_COMMIT was dropped when the version table was split up and the
          # x265 URL silently collapsed to get/.tar.gz.
          for var in $(grep -rhoE 'download "[^"]+"' src/packages/*.sh src/95-ffmpeg.sh |
            grep -oE '\$\{?[A-Za-z_][A-Za-z0-9_]*' | tr -d '${' | sort -u); do
            if ! grep -rqE "^[[:space:]]*(export )?$var=" src/; then
              echo "::error::\$$var is used in a download URL but is never assigned"
              status=1
            fi
          done

          exit $status

      # The options block in README.md is a copy of --help, and the two drifted:
      # --list-packages, --skip-install and --auto-install were all missing from
      # the README. Comparing them here is cheap and keeps the copy honest.
      - name: check the README option list matches --help
        run: |
          # usage() ends with an echo "", so the trailing blank line is trimmed
          # from both sides rather than carried into the README.
          ./build-ffmpeg --help | sed -n '/^Usage: build-ffmpeg/,$p' |
            sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' >/tmp/help.txt
          sed -n '/^Usage: build-ffmpeg \[OPTIONS\]/,/^```$/p' README.md |
            sed '$d' >/tmp/readme.txt
          if ! diff -u /tmp/readme.txt /tmp/help.txt; then
            echo "::error::the options block in README.md no longer matches ./build-ffmpeg --help"
            exit 1
          fi

  build-linux:
    name: build in native linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: install libva-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y libva-dev

      - name: build ffmpeg
        run: |
          while sleep 300; do echo "=====[ $SECONDS seconds still running ]====="; done &
          SKIPINSTALL=yes VERBOSE=yes ./build-ffmpeg --build --enable-gpl-and-non-free --disable=rav1e
          kill %1
      - name: check shared library
        run: |
          ldd ./workspace/bin/ffmpeg
      - name: test run ffmepg
        run: |
          ./workspace/bin/ffmpeg -buildconf
      - name: clean up
        run: |
          ./build-ffmpeg --cleanup

  # Every other job builds on a host with almost no -dev packages, but real users
  # build on full desktop distributions, and several packages autodetect whatever
  # they find there. That difference hid issue #266 for a whole release: with the
  # system libharfbuzz-dev installed, FreeType linked against it instead of the
  # workspace copy and ffmpeg's harfbuzz check then failed on an unresolved
  # hb_shape. This job installs exactly those tempting -dev packages so that the
  # contaminated-host case is covered, and asserts the affected libraries really
  # ended up in the binary rather than being silently skipped.
  build-linux-with-system-libs:
    name: build in native linux with system dev packages
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: install system dev packages that packages autodetect
        run: |
          sudo apt-get update
          sudo apt-get install -y libva-dev libharfbuzz-dev libfreetype-dev libpng-dev libbrotli-dev meson ninja-build

      - name: build ffmpeg
        run: |
          while sleep 300; do echo "=====[ $SECONDS seconds still running ]====="; done &
          SKIPINSTALL=yes VERBOSE=yes ./build-ffmpeg --build --enable-gpl-and-non-free --disable=rav1e
          kill %1

      # -buildconf on its own passes even when a library was quietly dropped, so
      # name the ones this job exists to protect.
      - name: check the autodetect-sensitive libraries are enabled
        run: |
          ./workspace/bin/ffmpeg -buildconf
          for lib in libharfbuzz libfreetype libfontconfig libass; do
            ./workspace/bin/ffmpeg -buildconf 2>&1 | grep -q -- "--enable-$lib" || {
              echo "::error::$lib is missing from the build configuration"
              exit 1
            }
          done

      - name: clean up
        run: |
          ./build-ffmpeg --cleanup

  # Fork-local addition: upstream ships as source only ("Releases are drafted
  # and published by hand ... nothing has to be uploaded here", see
  # release-version-check below) -- this fork also publishes the compiled
  # macOS binaries as release assets, because that's the whole point of the
  # fork: StreamDock's own CI curls prebuilt binaries for every other
  # platform and has no macOS equivalent to point at (evermeet.cx is the
  # only other macOS source and ships a GPL build; see
  # docs/macos-lgpl-ffmpeg-build-plan.md in the StreamDock repo). Matrixed
  # over both architectures GitHub still supports natively post the macOS-13
  # retirement (Dec 2025): macos-15 for arm64, macos-15-intel for x86_64 (its
  # replacement, available through Aug 2027) -- no cross-compiling either
  # direction.
  build-macos:
    name: build in native macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # The runner image ships aws/tap, which Homebrew now flags as untrusted
      # and warns about on every invocation. We do not use it, so remove it.
      - name: remove untrusted homebrew taps
        run: |
          brew untap aws/tap || true

      - name: build ffmpeg
        run: |
          while sleep 300; do echo "=====[ $SECONDS seconds still running ]====="; done &
          SKIPINSTALL=yes VERBOSE=yes ./build-ffmpeg --build
          kill %1
      - name: check shared library
        run: |
          otool -L ./workspace/bin/ffmpeg

      # This project takes multiple CI round trips to find by hand: a build
      # host with Homebrew's X11/idn2/zstd packages present (this runner
      # image) lets ffmpeg's own configure and libsdl's both auto-detect and
      # dynamically link them, even though every one of those was already
      # explicitly --disable-d at some earlier point in this file -- xcb,
      # vaapi, and xlib all turned out to be *separate*, independently
      # auto-detected features, not one flag closing all of them. None of
      # those Homebrew paths exist on an arbitrary end-user Mac, so a leak
      # here means a real dyld crash for every real user, not just a lint
      # nit -- hence a hard failure, not a warning. Anything outside
      # /System or /usr/lib is host-specific and must not be there; the
      # release package/upload steps below never run if this fails.
      - name: verify no host-specific dynamic dependencies leaked in
        run: |
          for bin in ffmpeg ffprobe; do
            leaked=$(otool -L "./workspace/bin/$bin" | tail -n +2 | awk '{print $1}' | grep -v '^/System/\|^/usr/lib/' || true)
            if [ -n "$leaked" ]; then
              echo "::error::$bin links host-specific libraries that won't exist on an end-user Mac:"
              echo "$leaked"
              exit 1
            fi
          done
      - name: test run ffmepg
        run: |
          ./workspace/bin/ffmpeg -buildconf

      # Gated on tag push only, so ordinary branch/PR builds stay exactly as
      # fast as upstream's -- no artifact is produced or uploaded for those.
      # No GPL/LGPL distinction to make here: the build step above never
      # passes --enable-gpl-and-non-free, so every artifact this job produces
      # is LGPL-only (no libx264/libx265) by construction, same as this job's
      # non-release runs always have been.
      - name: package release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tar -cJf ffmpeg-macos-${{ matrix.arch }}-lgpl.tar.xz -C workspace/bin ffmpeg ffprobe

      - name: upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ffmpeg-macos-${{ matrix.arch }}-lgpl.tar.xz

      - name: clean up
        run: |
          ./build-ffmpeg --cleanup

  # Fork-local addition, alongside build-macos above rather than folded into it: a second,
  # independent build with ENABLE_SHARED=yes (src/95-ffmpeg.sh), producing real
  # libavformat/libavcodec/libavutil/etc. .dylib files instead of only the static
  # ffmpeg/ffprobe executables build-macos already publishes. Exists for StreamDock's own
  # StreamDock.Core.Muxer, which links libavformat directly rather than shelling out to the CLI
  # (see that repo's own CMakeLists.txt/NOTICE.md) -- the static build has nothing to link
  # against, the same reason StreamDock's Windows leg already sources a separate shared BtbN
  # build instead of its own bundled static ffmpeg_lgpl.exe. Kept as its own job (not a matrix
  # axis on build-macos) so it can fail, be iterated on, or be removed without ever touching the
  # existing static build's own green history.
  build-macos-shared:
    name: build in native macOS, shared libs (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: remove untrusted homebrew taps
        run: |
          brew untap aws/tap || true

      - name: build ffmpeg (shared)
        run: |
          while sleep 300; do echo "=====[ $SECONDS seconds still running ]====="; done &
          ENABLE_SHARED=yes SKIPINSTALL=yes VERBOSE=yes ./build-ffmpeg --build
          kill %1

      - name: check shared libraries were actually produced
        run: |
          shopt -s nullglob
          dylibs=(workspace/lib/*.dylib)
          if [ ${#dylibs[@]} -eq 0 ]; then
            echo "::error::ENABLE_SHARED=yes produced no .dylib files in workspace/lib -- configure likely still resolved --disable-shared"
            exit 1
          fi
          otool -L workspace/lib/libavformat.*.dylib

      # Same rigor as build-macos's own "verify no host-specific dynamic dependencies leaked
      # in", against the shared libraries themselves instead of the ffmpeg/ffprobe executables --
      # this is the artifact a downstream consumer links against directly, so a leak here is a
      # link-time/runtime failure on every machine but this one, not just a lint nit. Also
      # confirms 95-ffmpeg.sh's own install_name rewrite actually ran: an unrewritten dylib would
      # still reference its own sibling libs via this build's absolute $PWD/workspace/lib path,
      # which is exactly what the grep below is scoped to catch alongside genuine Homebrew leaks.
      - name: verify no host-specific dynamic dependencies leaked in
        run: |
          workspace_abs="$(cd workspace && pwd)"
          for dylib in workspace/lib/*.dylib; do
            leaked=$(otool -L "$dylib" | tail -n +2 | awk '{print $1}' | grep -v '^/System/\|^/usr/lib/\|^@rpath/' || true)
            if [ -n "$leaked" ]; then
              echo "::error::$dylib links dependencies that won't resolve once this file is moved elsewhere:"
              echo "$leaked"
              exit 1
            fi
          done
          echo "workspace root was: $workspace_abs (only checked as context above, not matched against directly -- the @rpath allowlist already covers the rewritten-correctly case)"

      # Gated on tag push only, same as build-macos -- no artifact is produced or uploaded for
      # ordinary branch/PR builds. Only the ffmpeg-owned headers are packaged (not every
      # dependency's own headers that also happen to land under workspace/include from the same
      # shared --prefix), matching what StreamDock.Core.Muxer's own fetch-thirdparty.sh expects
      # to find -- same include/lib layout convention as a BtbN release, one top-level directory.
      - name: package shared release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name="ffmpeg-shared-macos-${{ matrix.arch }}"
          mkdir -p "$name/include" "$name/lib"
          for d in workspace/include/libav* workspace/include/libsw*; do
            [ -d "$d" ] && cp -R "$d" "$name/include/"
          done
          cp workspace/lib/*.dylib "$name/lib/"
          cp LICENSE "$name/LICENSE.txt"
          tar -cJf "$name.tar.xz" "$name"

      - name: upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ffmpeg-shared-macos-${{ matrix.arch }}.tar.xz

      - name: clean up
        run: |
          ./build-ffmpeg --cleanup

  build-docker:
    name: build in docker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: pull base image
        id: ubuntu_pull
        run: |
          docker pull ubuntu:26.04
      - name: run if ubuntu_pull failed
        if: failure() && steps.ubuntu_pull.outcome == 'failure'
        run: |
          docker pull ubuntu:26.04
      - name: build ffmpeg
        run: |
          docker build -t ffmpeg:ubuntu -f Dockerfile .
      - name: test run ffmepg
        run: |
          docker run --rm ffmpeg:ubuntu -buildconf

  build-cuda-ubuntu-docker:
    name: build in ubuntu docker with cuda
    runs-on: ubuntu-24.04
    steps:
      - name: Free up disk space
        run: |
          rm -rf /usr/share/dotnet && rm -rf /opt/ghc && rm -rf "/usr/local/share/boost"
          rm -rf /opt/hostedtoolcache && cd /opt && find . -maxdepth 1 -mindepth 1 '!' -path ./containerd '!' -path ./actionarchivecache '!' -path ./runner '!' -path ./runner-cache -exec rm -rf '{}' ';'
          docker system prune -af
      - name: Checkout code
        uses: actions/checkout@v5
      - name: pull base image
        id: cuda_ubuntu_pull
        run: |
          docker pull nvidia/cuda:13.3.1-devel-ubuntu26.04
          docker pull ubuntu:26.04
      - name: run if cuda_ubuntu_pull failed
        if: failure() && steps.cuda_ubuntu_pull.outcome == 'failure'
        run: |
          docker pull nvidia/cuda:13.3.1-devel-ubuntu26.04
          docker pull ubuntu:26.04
      - name: build ffmpeg
        run: |
          docker build -t ffmpeg:cuda-ubuntu -f cuda-ubuntu.dockerfile .
      - name: test run ffmepg
        run: |
          docker run --rm ffmpeg:cuda-ubuntu -buildconf

  build-full-static:
    name: full static build in docker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # full-static.dockerfile builds FROM ubuntu:26.04, not from a cuda image
      - name: pull base image
        id: ubuntu_pull
        run: |
          docker pull ubuntu:26.04
      - name: run if ubuntu_pull failed
        if: failure() && steps.ubuntu_pull.outcome == 'failure'
        run: |
          docker pull ubuntu:26.04
      - name: build ffmpeg
        run: |
          docker build -t ffmpeg:cuda-static -f full-static.dockerfile .
      - name: test run ffmepg
        run: |
          docker run --rm ffmpeg:cuda-static -buildconf

  # Releases are drafted and published by hand, and the installer downloads
  # GitHub's auto-generated archive for the tag, so nothing has to be uploaded
  # here. This job only guards the one mistake that hurts: tagging v1.63 on a
  # commit whose src/00-header.sh still says 1.62.
  #
  # It deliberately does not gate on the builds. There is no artifact to
  # withhold, so waiting an hour to report a wrong version string would only
  # delay the answer. The `on:` block above is likewise left alone: a tag push
  # is already a push event (and path filters do not apply to tags), so lint
  # and the five builds run for the tag as-is, while adding a `tags:` filter
  # there would stop branch pushes from triggering anything at all.
  release-version-check:
    name: check the tag matches SCRIPT_VERSION
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Checked against the tagged commit only, so master carrying the next
      # release's version stays legal. The tag has a v prefix, SCRIPT_VERSION
      # does not.
      - name: check the tag matches SCRIPT_VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^SCRIPT_VERSION=//p' src/00-header.sh | head -n 1)
          echo "tag=$TAG SCRIPT_VERSION=$version"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match SCRIPT_VERSION=$version in src/00-header.sh; expected tag v$version"
            exit 1
          fi
