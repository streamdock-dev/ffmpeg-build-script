# Builds the macOS libav *shared dev kit* that StreamDock loads in-process, and uploads it to an
# existing release. Separate from build.yml on purpose, and deliberately NOT built with
# build-ffmpeg:
#
#   - Its FFmpeg generation is set by the consuming binding, not by build-ffmpeg's own pin: the
#     binding resolves exact SONAMEs and cannot bind to anything else. 7.1.x serves Sdcb.FFmpeg
#     7.0.0 (libavutil.59, libavcodec.61, ...); 9.0.x serves FFmpeg.AutoGen 9.0.1 (libavutil.61,
#     libavcodec.63, ...). The "fetch and verify" step holds the SONAME table for each supported
#     line, and every later check reads it from there.
#   - It wants one third-party library and no more. The consumer needs decode plus the
#     avfoundation input device, not ~70 codecs, so the build takes minutes instead of an hour.
#     The one exception is dav1d (BSD-2-Clause), because FFmpeg 7.1 has no native AV1 software
#     decoder and VideoToolbox decodes AV1 only on M3 and later: without it an M1/M2 Mac cannot
#     play an AV1 file at all. It is built from a pinned, checksummed tarball as a static PIC
#     archive and linked INTO libavcodec, so the kit still depends on nothing outside itself. --disable-autodetect is what makes that true and is
#     not optional here: FFmpeg's configure links whatever it happens to find, and the first
#     hand-built pair of these kits silently picked up Homebrew's sdl2-compat into libavdevice,
#     which loads only on a machine that also has it. A hosted runner carries far more preinstalled
#     Homebrew than a dev box, so autodetect would make the artifact depend on the runner image.
#     With it off, "External libraries:" reports exactly the set asserted below.
#
# Triggered by hand, because its output is a pinned artifact that only changes when the FFmpeg
# generation does -- not something to rebuild on every push. Each architecture is built AND
# exercised on its own runner, which is the point: a cross-compiled slice can be produced on one
# machine but never executed, and that was the known gap in the first hand-built pair of these.
#
# See StreamDock's Docs/Reference/ThirdParty/ffmpeg-lgpl-fork-status.md for why this kit exists.
name: libav kit (macOS, shared)

on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: FFmpeg release to build (7.1.x for Sdcb.FFmpeg 7.0.0, 9.0.x for FFmpeg.AutoGen 9.0.1)
        required: true
        default: "9.0.2"
      sha256:
        description: sha256 of ffmpeg-<version>.tar.xz (ffmpeg.org publishes no checksum file)
        required: true
        default: "8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e"
      release_tag:
        description: existing release tag to upload the kit to
        required: true
        default: "btbn-mirror-n9.0.2"
      dav1d_version:
        description: dav1d release linked statically into libavcodec for AV1 software decode
        required: true
        default: "1.5.4"
      dav1d_sha256:
        description: sha256 of dav1d-<version>.tar.xz (as published alongside it on videolan.org)
        required: true
        default: "686616b7c69eb88d44459391ab25cac13b6647a3b288835c5784e71c1514a5c5"
      macos_min:
        description: deployment target; must not exceed what the consuming app supports
        required: true
        default: "11.0"

jobs:
  libav-kit:
    name: libav kit (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      # FFmpeg's x86 assembly needs nasm, which the macOS runner images do not carry. Without it
      # configure stops at "nasm/yasm not found or too old", and because it stops, the LGPL
      # licence line it is grepped for never appears either -- so the failure reads as a
      # licensing problem rather than a missing tool. Harmless on arm64, where there is no x86
      # assembly to build, so it is not matrix-conditional.
      # meson and ninja build dav1d; pkgconf is how FFmpeg's configure finds it. dav1d's x86
      # assembly needs nasm too.
      - name: install the assembler FFmpeg's x86 code needs
        run: brew install nasm meson ninja pkgconf

      # Static and position-independent, so it links into libavcodec.dylib and the kit gains no
      # dylib to ship or relocate. The deployment target goes in through the environment as well
      # as the flags so meson's own compiler probes and the assembler agree with the final link;
      # the minos check in the verify step covers the result either way.
      - name: build dav1d (static, for AV1 decode)
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ inputs.macos_min }}
        run: |
          ver='${{ inputs.dav1d_version }}'
          curl --fail -L --retry 6 --retry-all-errors --connect-timeout 30 \
            "https://downloads.videolan.org/pub/videolan/dav1d/$ver/dav1d-$ver.tar.xz" -o dav1d.tar.xz
          echo '${{ inputs.dav1d_sha256 }}  dav1d.tar.xz' > dav1d.tar.xz.sha256
          shasum -a 256 -c dav1d.tar.xz.sha256
          mkdir -p dav1d-src
          tar -xJf dav1d.tar.xz -C dav1d-src --strip-components=1
          meson setup dav1d-src/build dav1d-src \
            --prefix="$PWD/dav1d-out" --libdir=lib \
            --buildtype=release --default-library=static -Db_staticpic=true \
            -Denable_tools=false -Denable_tests=false -Denable_examples=false \
            -Dc_args="-mmacosx-version-min=${{ inputs.macos_min }}" \
            -Dc_link_args="-mmacosx-version-min=${{ inputs.macos_min }}"
          ninja -C dav1d-src/build install
          # A shared libdav1d next to the archive would be preferred by the linker and leak an
          # absolute path into libavcodec; the verify step would catch it, this names it sooner.
          if ls dav1d-out/lib/libdav1d*.dylib >/dev/null 2>&1; then
              echo "::error::dav1d produced a dylib; it must be static only"
              exit 1
          fi

      - name: fetch and verify the FFmpeg source
        run: |
          ver='${{ inputs.ffmpeg_version }}'
          # The library majors each supported line produces, which are what the consuming binding
          # binds to. A new line needs its row added here, read from the lib*/version_major.h
          # headers of its source, before anything else can check it.
          case "$ver" in
          7.1.*) majors="avutil=59 swresample=5 swscale=8 avcodec=61 avformat=61 avfilter=10 avdevice=61" ;;
          9.0.*) majors="avutil=61 swresample=7 swscale=10 avcodec=63 avformat=63 avfilter=12 avdevice=63" ;;
          *)
              echo "::error::no SONAME table for $ver; add its row to this step"
              exit 1
              ;;
          esac
          sonames=""
          for pair in $majors; do
              sonames="$sonames lib${pair%%=*}.${pair#*=}"
              echo "SONAME_${pair%%=*}=lib${pair%%=*}.${pair#*=}" >> "$GITHUB_ENV"
          done
          echo "SONAMES=${sonames# }" >> "$GITHUB_ENV"
          curl --fail -L --retry 6 --retry-all-errors --connect-timeout 30 \
            "https://ffmpeg.org/releases/ffmpeg-$ver.tar.xz" -o ffmpeg.tar.xz
          echo '${{ inputs.sha256 }}  ffmpeg.tar.xz' > ffmpeg.tar.xz.sha256
          shasum -a 256 -c ffmpeg.tar.xz.sha256
          mkdir -p src
          tar -xJf ffmpeg.tar.xz -C src --strip-components=1

      # --install-name-dir=@loader_path, not @rpath: this kit is dlopen'd by absolute path from a
      # process with no rpath of its own, where @rpath resolves only if the libraries happen to be
      # loaded in strict dependency order. src/95-ffmpeg.sh carries the long version of this.
      - name: configure and build
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/dav1d-out/lib/pkgconfig
        run: |
          cd src
          ./configure \
            --prefix="$PWD/../out" \
            --enable-shared --disable-static \
            --disable-programs --disable-doc \
            --disable-autodetect \
            --enable-videotoolbox --enable-audiotoolbox --enable-avfoundation \
            --enable-zlib --enable-bzlib \
            --enable-libdav1d \
            --install-name-dir='@loader_path' \
            --extra-cflags="-mmacosx-version-min=${{ inputs.macos_min }}" \
            --extra-ldflags="-mmacosx-version-min=${{ inputs.macos_min }}" 2>&1 | tee configure.out
          # configure prints this on stdout and records it nowhere else, so it is captured above
          # and grepped from the file -- checked here rather than after the build so a licensing
          # surprise costs seconds instead of minutes.
          grep -q '^License: LGPL' configure.out || {
              echo "::error::configure did not report an LGPL license:"
              grep -i '^License' configure.out || true
              exit 1
          }
          grep -A1 'Enabled indevs' configure.out | grep -q avfoundation || {
              echo "::error::avfoundation is not among the enabled input devices"
              exit 1
          }
          # Assert WHICH external libraries got linked, not just that the build succeeded. The
          # downstream "non-relocatable references" check only catches a leak that lives outside
          # /usr/lib, and only after a five-minute build; this names the cause immediately. It also
          # catches --disable-autodetect silently not applying, which is how the first hand-built
          # kit acquired Homebrew's sdl2: the flag reached configure inside a single quoted
          # argument and was ignored rather than rejected.
          externals=$(awk '/^External libraries:/ { grab = 1; next } /^External libraries providing/ { grab = 0 } grab && NF { for (i = 1; i <= NF; i++) print $i }' configure.out | sort -u)
          # zlib and bzlib are re-enabled explicitly on top of --disable-autodetect: they are in
          # /usr/lib on every macOS, so they cannot make the kit unportable, and dropping them
          # would silently cost the consumer container and codec features it had before --
          # RecorderService uses this same kit to decode source files, not just to open a camera.
          # iconv is NOT re-enabled, though it is equally system-resident: --enable-iconv forces
          # the feature on while --disable-autodetect skips the check that would add -liconv, so
          # libavcodec ends up referencing _iconv/_iconv_open/_iconv_close with nothing providing
          # them and the link fails. It only serves subtitle charset conversion, which neither
          # consumer uses, so it is dropped rather than patched with --extra-libs.
          # libdav1d is the one non-system entry, and it is static (see the dav1d step).
          unexpected=$(printf '%s\n' "$externals" | grep -vE '^(avfoundation|zlib|bzlib|libdav1d)$' || true)
          if [ -n "$unexpected" ]; then
              echo "::error::configure linked external libraries beyond the expected system set, so this kit would only load on a machine that has them:"
              printf '%s\n' "$unexpected"
              exit 1
          fi
          printf '%s\n' "$externals" | grep -qx libdav1d || {
              echo "::error::libdav1d is not among the linked external libraries"
              exit 1
          }
          make -j"$(sysctl -n hw.ncpu)"
          make install

          # Give each library its own leaf name as its LC_ID_DYLIB, leaving every dependency
          # reference as @loader_path/... exactly as configure wrote it.
          #
          # --install-name-dir sets both, and the id it produces (@loader_path/libavutil.59.dylib)
          # makes the kit unloadable by its real consumer. .NET reaches these through a bare-name
          # dlopen (Sdcb's [DllImport("libavutil.59.dylib")]), and dyld matches a
          # bare name against an already-loaded image ONLY by that image's install name -- never
          # by the path it was loaded from. So the consumer's preload of every library by
          # absolute path succeeds, logs nothing, and then every call fails with
          # DllNotFoundException. Measured both ways on an M1: with the id as shipped the
          # bare-name load throws, with the id rewritten to the leaf it resolves.
          #
          # Only the id changes, so the relocatability this kit is built for is untouched: the
          # dependency entries verified below stay @loader_path-relative and load-order
          # independent. Re-signing follows because install_name_tool invalidates the signature.
          # ../out, not out: this step starts with `cd src`, and configure's prefix is
          # "$PWD/../out" from there. The verify step below is a separate step that starts at
          # the workspace root, which is why its own path is out/lib.
          for dylib in ../out/lib/*.dylib; do
              [ -L "$dylib" ] && continue
              leaf=$(basename "$dylib" | cut -d. -f1,2).dylib
              install_name_tool -id "$leaf" "$dylib"
              codesign -f -s - "$dylib"
          done

      # Everything the consumer actually depends on, checked on the architecture that will run it.
      - name: verify the kit
        run: |
          lib=out/lib
          fail=0
          for soname in $SONAMES; do
              if [ ! -e "$lib/$soname.dylib" ]; then
                  echo "::error::missing $soname.dylib"
                  fail=1
              fi
          done

          arch=$(lipo -info "$lib/$SONAME_avcodec.dylib" | sed 's/.*: //')
          [ "$arch" = "${{ matrix.arch }}" ] || { echo "::error::built $arch, expected ${{ matrix.arch }}"; fail=1; }

          # The floor is the builder's own OS version unless it was passed explicitly, and that
          # failure is invisible on the machine that produces it.
          for dylib in "$lib"/*.dylib; do
              [ -L "$dylib" ] && continue
              # No early exit in the awk: it would SIGPIPE vtool, and pipefail would fail the step.
              minos=$(vtool -show-build "$dylib" | awk '/minos/ { m = $2 } END { print m }')
              [ "$minos" = "${{ inputs.macos_min }}" ] || { echo "::error::$(basename "$dylib") minos=$minos, expected ${{ inputs.macos_min }}"; fail=1; }
          done

          # Each library's own id must be its bare leaf name, which is what lets a bare-name
          # dlopen find it once it has been loaded by absolute path. A kit that regressed to
          # @loader_path here would still pass every other check and then fail to load at all in
          # the consumer, with nothing in its log naming the cause.
          for dylib in "$lib"/*.dylib; do
              [ -L "$dylib" ] && continue
              id=$(otool -D "$dylib" | tail -1)
              leaf=$(basename "$dylib" | cut -d. -f1,2).dylib
              [ "$id" = "$leaf" ] || { echo "::error::$(basename "$dylib") has install name '$id', expected '$leaf'"; fail=1; }
          done

          # No absolute build paths and no @rpath: every reference must be @loader_path, so the
          # set is relocatable and load-order independent.
          for dylib in "$lib"/*.dylib; do
              [ -L "$dylib" ] && continue
              # otool -L prints the file path, then the library's own LC_ID_DYLIB, then the
              # dependencies. tail -n +2 drops the path but keeps the id, which is now a bare
              # leaf name and would read as a non-relocatable dependency -- so the id is
              # excluded by value rather than by counting lines, which otool's output shape
              # does not guarantee. Nothing can legitimately depend on itself.
              self_id=$(otool -D "$dylib" | tail -1)
              leaked=$(otool -L "$dylib" | tail -n +2 | awk '{print $1}' | grep -vxF "$self_id" | grep -v '^/System/\|^/usr/lib/\|^@loader_path/' || true)
              if [ -n "$leaked" ]; then
                  echo "::error::$(basename "$dylib") has non-relocatable references:"
                  echo "$leaked"
                  fail=1
              fi
              while IFS= read -r dep; do
                  [ -n "$dep" ] || continue
                  [ -e "$lib/${dep#@loader_path/}" ] || { echo "::error::$(basename "$dylib") names $dep, which is not in the kit"; fail=1; }
              done < <(otool -L "$dylib" | tail -n +2 | awk '{print $1}' | grep '^@loader_path/' | sort -u)
          done

          # Dumped to a file first: `strings | grep -m1` has grep close the pipe on its match,
          # which SIGPIPEs strings, and under pipefail that reads as failure.
          strings "$lib/$SONAME_avutil.dylib" > avutil.strings
          cfg=$(grep -m1 -- '--enable-shared' avutil.strings || true)
          case "$cfg" in
          *--enable-gpl* | *--enable-nonfree*)
              echo "::error::GPL or non-free flags present: $cfg"
              fail=1
              ;;
          esac

          [ "$fail" -eq 0 ] || exit 1
          echo "static checks passed for ${{ matrix.arch }}"

      # The reason each slice is built on its own runner rather than cross-compiled: this actually
      # executes it. Loads the whole set by absolute path with nothing preloaded and the most
      # dependent library FIRST, then asks libavdevice whether avfoundation is registered -- the
      # capability a webcam or display-capture source needs. Opening a device is not possible here
      # (a hosted runner has no camera), so registration is as far as this can honestly go. Then
      # does the same for the libdav1d AV1 decoder, which also proves the static archive's code
      # really is inside libavcodec rather than referenced from somewhere else.
      - name: load the kit and confirm avfoundation and libdav1d register
        run: |
          cat > probe.c <<'EOF'
          #include <stdio.h>
          #include <string.h>
          #include <dlfcn.h>
          int main(int argc, char **argv) {
              char path[2048];
              snprintf(path, sizeof path, "%s/%s.dylib", argv[1], argv[2]);
              void *h = dlopen(path, RTLD_NOW | RTLD_GLOBAL);
              if (!h) { fprintf(stderr, "dlopen: %s\n", dlerror()); return 1; }
              void (*reg)(void) = dlsym(h, "avdevice_register_all");
              const void *(*next)(const void *) = dlsym(h, "av_input_video_device_next");
              if (!reg || !next) { fprintf(stderr, "dlsym failed\n"); return 2; }
              reg();
              const void *f = NULL;
              while ((f = next(f))) {
                  const char *n = *(const char *const *)f;
                  if (n && !strcmp(n, "avfoundation")) break;
              }
              if (!f) { fprintf(stderr, "avfoundation not registered\n"); return 3; }
              printf("avfoundation registered\n");
              // libavcodec is already loaded as libavdevice's dependency, so RTLD_DEFAULT finds it.
              const void *(*find)(const char *) = dlsym(RTLD_DEFAULT, "avcodec_find_decoder_by_name");
              if (!find) { fprintf(stderr, "dlsym avcodec_find_decoder_by_name failed\n"); return 2; }
              if (!find("libdav1d")) { fprintf(stderr, "libdav1d decoder not registered\n"); return 4; }
              printf("libdav1d registered\n");
              return 0;
          }
          EOF
          clang -O1 -o probe probe.c
          ./probe "$PWD/out/lib" "$SONAME_avdevice"

      - name: package the kit
        run: |
          ver='${{ inputs.ffmpeg_version }}'
          name="ffmpeg-n$ver-macos-${{ matrix.arch }}-lgpl-shared-${ver%.*}"
          mkdir -p "$name"
          # -a keeps the symlink farm: dyld resolves a dependency through whichever recorded name
          # it finds, and dereferencing triples the size for no gain.
          cp -a out/lib "$name/lib"
          cp -a out/include "$name/include"
          rm -rf "$name/lib/pkgconfig"
          cp src/COPYING.LGPLv2.1 "$name/"
          cp dav1d-src/COPYING "$name/COPYING.dav1d"
          tar -cJf "$name.tar.xz" "$name"
          shasum -a 256 "$name.tar.xz" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "KIT=$name.tar.xz" >> "$GITHUB_ENV"

      - name: upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ inputs.release_tag }}' "$KIT" --clobber \
            --repo '${{ github.repository }}'
